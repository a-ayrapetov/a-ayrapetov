<svg xmlns="http://www.w3.org/2000/svg" width="880" height="856" viewBox="0 0 880 856" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Six steps from requirement to in service, each step ending at a gate; a failed gate goes back to the step named on its red line" xmlns:c2pa="http://c2pa.org/manifest">
<line x1="150" y1="44" x2="150" y2="816" stroke="#5fae8e" stroke-width="8" stroke-linecap="round"/>
<path d="M 144 248.0 C 116 248.0, 116 248.0, 116 228.0 L 116 196 C 116 176, 116 176, 124 176" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="126,176 116,170 116,182" fill="#f85149"/>
<path d="M 144 380.0 C 116 380.0, 116 380.0, 116 360.0 L 116 328 C 116 308, 116 308, 124 308" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="126,308 116,302 116,314" fill="#f85149"/>
<path d="M 144 512.0 C 116 512.0, 116 512.0, 116 492.0 L 116 460 C 116 440, 116 440, 124 440" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="126,440 116,434 116,446" fill="#f85149"/>
<path d="M 144 644.0 C 102 644.0, 102 644.0, 102 624.0 L 102 460 C 102 440, 102 440, 124 440" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="126,440 116,434 116,446" fill="#f85149"/>
<path d="M 144 776.0 C 24 776.0, 24 776.0, 24 756.0 L 24 64 C 24 44, 24 44, 124 44" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="126,44 116,38 116,50" fill="#f85149"/>
<circle cx="150" cy="44" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="51" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">1</text>
<text x="190" y="46" font-size="22" font-weight="700" fill="#e6edf3">Requirement</text>
<text x="190" y="71" font-size="16" fill="#9198a1">The ask becomes a control with a scope and a pass condition.</text>
<circle cx="150" cy="176" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="183" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">2</text>
<text x="190" y="178" font-size="22" font-weight="700" fill="#e6edf3">Assess</text>
<text x="190" y="203" font-size="16" fill="#9198a1">Passive inventory, every config baselined and audited, gaps per zone.</text>
<rect x="190" y="233.0" width="16" height="30" rx="8" fill="#e6edf3"/>
<circle cx="198" cy="242.0" r="4.5" fill="#3fb950"/><circle cx="198" cy="255.0" r="4.5" fill="#f85149"/>
<text x="218" y="254.0" font-size="16"><tspan font-weight="700" fill="#e6edf3">Assets and gaps known?</tspan><tspan dx="14" fill="#3fb950" font-weight="600">yes: on to step 3</tspan><tspan dx="14" fill="#f85149" font-weight="600">no: keep assessing</tspan></text>
<circle cx="150" cy="308" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="315" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">3</text>
<text x="190" y="310" font-size="22" font-weight="700" fill="#e6edf3">Design</text>
<text x="190" y="335" font-size="16" fill="#9198a1">Zones, conduits and access policy, replayed against real traffic.</text>
<rect x="190" y="365.0" width="16" height="30" rx="8" fill="#e6edf3"/>
<circle cx="198" cy="374.0" r="4.5" fill="#3fb950"/><circle cx="198" cy="387.0" r="4.5" fill="#f85149"/>
<text x="218" y="386.0" font-size="16"><tspan font-weight="700" fill="#e6edf3">Design holds on real traffic?</tspan><tspan dx="14" fill="#3fb950" font-weight="600">yes: on to step 4</tspan><tspan dx="14" fill="#f85149" font-weight="600">no: redesign</tspan></text>
<circle cx="150" cy="440" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="447" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">4</text>
<text x="190" y="442" font-size="22" font-weight="700" fill="#e6edf3">Prepare the change</text>
<text x="190" y="467" font-size="16" fill="#9198a1">Procedure, lockout check, health check, rollback written first.</text>
<rect x="190" y="497.0" width="16" height="30" rx="8" fill="#e6edf3"/>
<circle cx="198" cy="506.0" r="4.5" fill="#3fb950"/><circle cx="198" cy="519.0" r="4.5" fill="#f85149"/>
<text x="218" y="518.0" font-size="16"><tspan font-weight="700" fill="#e6edf3">Lockout and rollback clear?</tspan><tspan dx="14" fill="#3fb950" font-weight="600">yes: on to step 5</tspan><tspan dx="14" fill="#f85149" font-weight="600">no: hold, fix, check again</tspan></text>
<circle cx="150" cy="572" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="579" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">5</text>
<text x="190" y="574" font-size="22" font-weight="700" fill="#e6edf3">Deliver</text>
<text x="190" y="599" font-size="16" fill="#9198a1">One batch at a time, every batch proven before the next.</text>
<rect x="190" y="629.0" width="16" height="30" rx="8" fill="#e6edf3"/>
<circle cx="198" cy="638.0" r="4.5" fill="#3fb950"/><circle cx="198" cy="651.0" r="4.5" fill="#f85149"/>
<text x="218" y="650.0" font-size="16"><tspan font-weight="700" fill="#e6edf3">Every proof passed?</tspan><tspan dx="14" fill="#3fb950" font-weight="600">yes: on to step 6</tspan><tspan dx="14" fill="#f85149" font-weight="600">no: roll back the batch, step 4</tspan></text>
<circle cx="150" cy="704" r="20" fill="#0d1117" stroke="#5fae8e" stroke-width="6"/>
<text x="150" y="711" text-anchor="middle" font-size="19" font-weight="800" fill="#5fae8e">6</text>
<text x="190" y="706" font-size="22" font-weight="700" fill="#e6edf3">Operate and defend</text>
<text x="190" y="731" font-size="16" fill="#9198a1">Drift, health and detection checks keep running after handover.</text>
<rect x="190" y="761.0" width="16" height="30" rx="8" fill="#e6edf3"/>
<circle cx="198" cy="770.0" r="4.5" fill="#3fb950"/><circle cx="198" cy="783.0" r="4.5" fill="#f85149"/>
<text x="218" y="782.0" font-size="16"><tspan font-weight="700" fill="#e6edf3">Any finding?</tspan><tspan dx="14" fill="#3fb950" font-weight="600">no: in service</tspan><tspan dx="14" fill="#f85149" font-weight="600">yes: new requirement, step 1</tspan></text>
<circle cx="150" cy="816" r="10" fill="#3fb950"/>
<text x="190" y="823" font-size="20" font-weight="700" fill="#3fb950">In service</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>